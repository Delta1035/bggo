name: Release draft

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag against component version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag)
          if not match:
              raise SystemExit('Expected vX.Y.Z (numeric semver only, e.g. v0.2.3)')
          version = f'{match[1]}.{match[2]}.{match[3]}'
          desktop_ver = json.load(open('mygo.json'))['version']
          vscode_ver = json.load(open('extensions/bggo-vscode/package.json'))['version']
          main = open('main.go', encoding='utf-8').read()
          match_main = re.search(r'const AppVersion = "v?([0-9]+\.[0-9]+\.[0-9]+)"', main)
          main_ver = match_main.group(1) if match_main else None
          versions = {'mygo.json': desktop_ver, 'package.json': vscode_ver, 'main.go': main_ver}
          if set(versions.values()) != {version}:
              raise SystemExit(f'Tag {tag} and component versions disagree: {versions}')
          PY

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
      - name: Prepare release assets
        run: |
          for vsix in release-assets/bggo-wallpaper-*.vsix; do
            if [ -f "$vsix" ]; then
              cp "$vsix" release-assets/bggo-wallpaper.vsix
              break
            fi
          done
      - name: Write checksums and build metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf 'tag=%s\ncommit=%s\nrun=%s/%s/actions/runs/%s\n' \
            "$RELEASE_TAG" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > release-assets/BUILD-INFO.txt
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          BGGo 发布版本。
          包含桌面客户端安装包（Linux deb / tar.gz、Windows exe / portable zip）、更新清单以及 VS Code 壁纸扩展包。
          SHA256SUMS.txt 提供完整性校验；BUILD-INFO.txt 记录构建提交和运行链接。
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "$RELEASE_TAG" \
            --notes-file notes.md --draft --prerelease
